name: Idea or feature request
description: Something you would like to see in one of the BrickWorld apps.
labels: ["enhancement"]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - BrickSampler
        - BrickLooper
        - BrickTape
        - BrickFX
        - BrickAmbientFX
        - A new app
        - The website
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and how would you use it in your music?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Anything similar you know?
      description: A piece of hardware or software that does it well, a link or a video.
